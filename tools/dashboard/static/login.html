<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cascade Ops</title>
<style>
  :root { --bg:#0b0d12; --panel:#141821; --line:#252b38; --text:#e8ecf3; --muted:#8b94a7; --accent:#7c9cff; }
  @media (prefers-color-scheme: light) { :root { --bg:#f5f7fb; --panel:#fff; --line:#e3e7ef; --text:#141821; --muted:#5d6678; --accent:#3d5afe; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  form { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:28px; width:min(380px,100%); }
  h1 { margin:0 0 4px; font-size:20px; } p { margin:0 0 20px; color:var(--muted); font-size:14px; }
  input { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); font: inherit; }
  button { margin-top:12px; width:100%; padding:11px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; font-size:15px; cursor:pointer; }
</style>
</head>
<body>
<form method="get" action="/">
  <h1>Cascade Ops</h1>
  <p>Enter the access token to open the dashboard.</p>
  <input name="token" type="password" placeholder="Access token" autocomplete="current-password" autofocus required>
  <button type="submit">Open dashboard</button>
</form>
</body>
</html>
